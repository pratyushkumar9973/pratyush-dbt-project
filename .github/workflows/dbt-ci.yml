
name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pratyush_dbt_project1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt Databricks
        run: pip install dbt-databricks==1.12.5

      - name: Check installed dbt version
        run: dbt --version

    
      - name: Create temporary dbt profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-profiles"
          cat > "$RUNNER_TEMP/dbt-profiles/profiles.yml" <<'EOF'
          pratyush_dbt_project1:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: dbt_tutorial_dev
                schema: source
                host: placeholder.databricks.com
                http_path: /sql/1.0/warehouses/placeholder
                token: placeholder
                threads: 1
          EOF

      - name: Validate dbt project
        run: dbt parse --no-partial-parse
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt-profiles

