
name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pratyush_dbt_project1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt Databricks
        run: pip install dbt-databricks==1.12.5

      - name: Check installed dbt version
        run: dbt --version

      - name: Validate dbt project
        run: dbt parse --no-partial-parse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
